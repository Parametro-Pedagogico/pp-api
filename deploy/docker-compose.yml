# Implantação do CENTRAL (pp-api) na VM dedicada.
# Serviços: Cloud SQL Auth Proxy + API (uvicorn) + relay da outbox. Caddy fica no host (ver Caddyfile.modelo).
# Ver docs/infra-topologia.md e docs/infra-gcp.md. Copie env.producao.modelo para .env e preencha.

services:
  cloudsql:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
    # A VM usa a SA anexada (ADC) para autenticar no Cloud SQL.
    command: ["--address", "0.0.0.0", "--port", "5432", "${CLOUDSQL_INSTANCE}"]
    restart: unless-stopped

  api:
    build: ..
    env_file: .env
    environment:
      PORT: "8000"
    depends_on: [cloudsql]
    ports:
      - "127.0.0.1:8000:8000" # só localhost; o Caddy do host faz o HTTPS
    restart: unless-stopped

  relay:
    build: ..
    env_file: .env
    depends_on: [cloudsql]
    command: ["python", "-m", "app.events.relay_loop"]
    restart: unless-stopped
